name: iOS

# The SwiftUI app with the shared Kotlin framework: a public unsigned IPA,
# and a signed one for the owner's devices when the signing secrets are set.
on:
  push:
    branches: [main, dev, 'claude/**']
    paths-ignore: ['androidApp/**', '**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds it and attaches the IPA.
  release:
    types: [published]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    # This image also includes Xcode 26; select it explicitly below.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # Xcode's build phase runs Gradle for the shared Kotlin framework.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-macos15-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ hashFiles('iosApp/project.yml') }}

      - name: Reader motion tests
        working-directory: iosApp
        run: |
          set -o pipefail
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(), reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project AENHT.xcodeproj -scheme AENHTReaderTests \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -clonedSourcePackagesDirPath build/SourcePackages -derivedDataPath build/ReaderTests \
            -resultBundlePath build/ReaderTests.xcresult CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee reader-tests.log | tail -70

      - name: Upload reader test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aenht-ios-reader-tests
          path: |
            iosApp/reader-tests.log
            iosApp/build/ReaderTests.xcresult
          if-no-files-found: ignore

      # The reader's gestures on an iPad simulator (pinch, then one finger),
      # on Claude's branches: what the scroll views did goes to the log.
      - name: Reader gestures (iPad)
        if: startsWith(github.ref, 'refs/heads/claude/')
        continue-on-error: true
        working-directory: iosApp
        run: |
          set -o pipefail
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(), reverse=True) if "iOS" in k for v in vs if "iPad" in v["name"]))')
          xcodebuild -project AENHT.xcodeproj -scheme AENHTReaderUITests \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath build/SourcePackages -derivedDataPath build/ReaderGestures \
            -resultBundlePath build/ReaderGestures.xcresult CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee reader-gestures.log | grep -E "^\[|error:|Test Case|TEST (SUCCEEDED|FAILED)|XCTAssert" | head -120

      - name: Build
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project AENHT.xcodeproj \
            -scheme AENHT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        working-directory: iosApp
        run: |
          for LOG in build.log reader-tests.log; do
            [ -f "$LOG" ] || continue
            grep -E "error:|e: " -A3 "$LOG" | head -200 || true
            tail -80 "$LOG"
          done

      # The unsigned IPA is the public download (dev-latest, releases): anyone
      # signs it with their own Apple ID. The signed one below holds the
      # owner's provisioning profile (name, team, device ids), so it is kept
      # only as a short-lived workflow artifact.
      - name: Package unsigned IPA
        working-directory: iosApp
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          rm -rf build/ipa-unsigned && mkdir -p build/ipa-unsigned/Payload
          cp -R "$APP" build/ipa-unsigned/Payload/
          (cd build/ipa-unsigned && zip -qry "../AENHT_${VERSION}_${BUILD}_unsigned.ipa" Payload)
          cp "build/AENHT_${VERSION}_${BUILD}_unsigned.ipa" build/AENHT.ipa
          ls -lh build/*.ipa

      # Signs the app when the signing secrets are set (see docs/ios-signing.md).
      - name: Sign
        id: sign
        working-directory: iosApp
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "No signing secrets: the IPA is unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          WORK="$RUNNER_TEMP/signing"; mkdir -p "$WORK"
          echo "$P12_BASE64" | base64 --decode > "$WORK/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$WORK/profile.mobileprovision"

          # macOS can't import a .p12 written with OpenSSL 3's defaults (AES-256,
          # SHA-256 MAC: "MAC verification failed"). Re-encode it the old way
          # (3DES, SHA-1) with the same password. The password stays in the
          # environment, never on a command line.
          OPENSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$OPENSSL" ] || OPENSSL=openssl
          if ! "$OPENSSL" pkcs12 -in "$WORK/cert.p12" -passin env:P12_PASSWORD -nodes -out "$WORK/cert.pem" 2>/dev/null \
            && ! "$OPENSSL" pkcs12 -legacy -in "$WORK/cert.p12" -passin env:P12_PASSWORD -nodes -out "$WORK/cert.pem" 2>/dev/null; then
            echo "::error::The .p12 can't be opened with IOS_CERT_PASSWORD: check that the password secret belongs to this certificate."
            exit 1
          fi
          "$OPENSSL" pkcs12 -export -in "$WORK/cert.pem" -out "$WORK/legacy.p12" -passout env:P12_PASSWORD \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          rm -f "$WORK/cert.pem"

          # Temporary keychain with the certificate.
          KEYCHAIN="$WORK/signing.keychain-db"
          security create-keychain -p temp "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import "$WORK/legacy.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          # The logs of a public repository are public: hide who signs.
          [ -n "$IDENTITY" ] && echo "::add-mask::$IDENTITY"
          if [ -z "$IDENTITY" ]; then echo "::error::The certificate has no valid code-signing identity (wrong password, expired or revoked?)"; security find-identity -p codesigning "$KEYCHAIN"; exit 1; fi

          # What the profile allows.
          security cms -D -i "$WORK/profile.mobileprovision" > "$WORK/profile.plist"
          PB=/usr/libexec/PlistBuddy
          TEAM=$($PB -c "Print :TeamIdentifier:0" "$WORK/profile.plist")
          APPID=$($PB -c "Print :Entitlements:application-identifier" "$WORK/profile.plist")
          PROFILE_ID="${APPID#${TEAM}.}"
          EXPIRES=$($PB -c "Print :ExpirationDate" "$WORK/profile.plist")
          NAME=$($PB -c "Print :Name" "$WORK/profile.plist")
          echo "::add-mask::$TEAM"
          TEAM_NAME=$($PB -c "Print :TeamName" "$WORK/profile.plist" 2>/dev/null || true)
          [ -n "$TEAM_NAME" ] && echo "::add-mask::$TEAM_NAME"
          DEVICES=$($PB -c "Print :ProvisionedDevices" "$WORK/profile.plist" 2>/dev/null | grep -c '^ ' || true)
          echo "Identity:  $IDENTITY"
          echo "Profile:   $NAME (team $TEAM, app id $PROFILE_ID, expires $EXPIRES, devices ${DEVICES:-all})"
          echo "### iOS signing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: $NAME, app id \`$PROFILE_ID\`, expires $EXPIRES, ${DEVICES:-all} devices" >> "$GITHUB_STEP_SUMMARY"

          # A profile for one app id signs that bundle id; a wildcard keeps ours.
          BUNDLE_ID=$($PB -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          if [ "$PROFILE_ID" != "*" ] && [[ "$PROFILE_ID" != *"*" ]]; then
            BUNDLE_ID="$PROFILE_ID"
            $PB -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          fi
          echo "Bundle id: $BUNDLE_ID"

          # Entitlements from the profile, with wildcards made concrete.
          $PB -x -c "Print :Entitlements" "$WORK/profile.plist" > "$WORK/entitlements.plist"
          $PB -c "Set :application-identifier $TEAM.$BUNDLE_ID" "$WORK/entitlements.plist"
          if $PB -c "Print :com.apple.developer.ubiquity-kvstore-identifier" "$WORK/entitlements.plist" >/dev/null 2>&1; then
            $PB -c "Set :com.apple.developer.ubiquity-kvstore-identifier $TEAM.$BUNDLE_ID" "$WORK/entitlements.plist"
          fi
          $PB -c "Delete :com.apple.developer.icloud-container-identifiers" "$WORK/entitlements.plist" 2>/dev/null || true
          $PB -c "Delete :com.apple.developer.icloud-services" "$WORK/entitlements.plist" 2>/dev/null || true

          cp "$WORK/profile.mobileprovision" "$APP/embedded.mobileprovision"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) -maxdepth 1 -print0 | \
              xargs -0 -I{} codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "{}"
          fi
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --entitlements "$WORK/entitlements.plist" --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "- Signed bundle id: \`$BUNDLE_ID\` ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing/signing.keychain-db" 2>/dev/null || true

      - name: Package signed IPA
        if: steps.sign.outputs.signed == 'true'
        working-directory: iosApp
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          rm -rf build/signed && mkdir -p build/signed
          (cd build/ipa && zip -qry "../signed/AENHT_${VERSION}_${BUILD}_signed.ipa" Payload)
          ls -lh build/signed/

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: aenht-ios
          path: iosApp/build/AENHT_*_unsigned.ipa
          if-no-files-found: error

      - name: Upload signed IPA
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aenht-ios-signed
          path: iosApp/build/signed/*.ipa
          retention-days: 3
          if-no-files-found: error

      # Every push to dev replaces the files of the "dev-latest" pre-release,
      # so the newest build is a direct download (no zip).
      - name: Publish to the dev-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Newest development build from the dev branch (commit ${GITHUB_SHA::7}). Experimental: not a release."
          gh release view dev-latest >/dev/null 2>&1 || \
            gh release create dev-latest --prerelease --target dev --title "Development build" --notes "$NOTES" || true
          uploaded=false
          for i in 1 2 3; do
            if gh release upload dev-latest iosApp/build/AENHT.ipa --clobber; then uploaded=true; break; fi
            if [ "$i" -lt 3 ]; then sleep 10; fi
          done
          if [ "$uploaded" != true ]; then echo "::error::IPA upload failed after three attempts"; exit 1; fi
          gh release edit dev-latest --notes "$NOTES" || true

      # A release published on GitHub gets the unsigned IPA from this build (the
      # tag's commit; never the signed one, which carries the owner's identity).
      - name: Attach the IPA to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # iOS keeps a numeric marketing version; the asset includes the beta/rc release label.
          VERSION="${RELEASE_TAG#v}"
          cp iosApp/build/AENHT.ipa "iosApp/build/AENHT-${VERSION}.ipa"
          uploaded=false
          for i in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "iosApp/build/AENHT-${VERSION}.ipa" --clobber; then uploaded=true; break; fi
            if [ "$i" -lt 3 ]; then sleep 10; fi
          done
          if [ "$uploaded" != true ]; then echo "::error::IPA upload failed after three attempts"; exit 1; fi
