name: Android

# Shared Kotlin module tests and the Android app (debug APK + screenshot tests).
on:
  push:
    branches: [main, dev, 'claude/**']
    paths-ignore: ['iosApp/**', '**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Shared tests, APK, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared module tests
        run: ./gradlew --no-daemon :shared:jvmTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Screenshot tests
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest

      - name: Package APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' androidApp/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' androidApp/build.gradle.kts)
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "dist/AENHT_${VERSION}_${CODE}_debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aenht-android-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aenht-android-screens
          path: androidApp/build/screens/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aenht-test-reports
          path: |
            shared/build/reports/
            androidApp/build/reports/
