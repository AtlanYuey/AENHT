# Native iOS / iPadOS app (SwiftUI). Generate the Xcode project with
#   brew install xcodegen && cd iosApp && xcodegen generate
# Building it runs Gradle for ../shared, so a JDK 21 must be installed.
name: AENHT
options:
  bundleIdPrefix: com.atlanyuey
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.8.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "7"
    AENHT_PRERELEASE: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  AENHTReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AENHT/Features/Reader/ReaderScrollMotion.swift
      - path: AENHT/Features/Reader/ReaderScrollDriver.swift
      - path: Tests/ReaderScrollTests.swift
      - path: AENHT/Features/Reader/ReaderStripImages.swift
      - path: Tests/ReaderImagePreparationTests.swift
      - path: AENHT/Core/AppVersion.swift
      - path: Tests/AppVersionTests.swift
    dependencies:
      - package: Nuke
        product: Nuke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlanyuey.AENHT.ReaderTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  AENHTCredentialTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AENHT/Core/AtomicCredentials.swift
      - path: Tests/AtomicCredentialsTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlanyuey.AENHT.CredentialTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  AENHT:
    type: application
    platform: iOS
    sources:
      - path: AENHT
    # The shared Kotlin module (../shared), built by Gradle for the SDK and
    # architectures Xcode is building.
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_NAME: AENHT
        PRODUCT_BUNDLE_IDENTIFIER: com.atlanyuey.ENHentai
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SUPPORTS_MACCATALYST: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    info:
      path: AENHT/Info.plist
      properties:
        CFBundleDisplayName: AENHT
        CFBundleName: AENHT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AENHTPrerelease: $(AENHT_PRERELEASE)
        CFBundleLocalizations: [en, ja, zh-Hans, zh-Hant, ko, es, fr, de, it, pt-BR, ru, vi, th, id]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        NSPhotoLibraryAddUsageDescription: Saves reader pages to your photo library.
        NSFaceIDUsageDescription: Unlocks the app when App Lock is on.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true

# The credential tests are hostless and use an injected in-memory secret store.
schemes:
  AENHTReaderTests:
    build:
      targets:
        AENHTReaderTests: all
    test:
      targets:
        - AENHTReaderTests
  AENHT:
    build:
      targets:
        AENHT: all
  AENHTCredentialTests:
    build:
      targets:
        AENHTCredentialTests: all
    test:
      targets:
        - AENHTCredentialTests
